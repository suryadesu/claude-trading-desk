# An NSE bot, a decision model, a dashboard and a keepalive. Built for Oracle
# Cloud Always Free (Ampere A1, ARM64, 2 OCPU / 12 GB); pick the Mumbai or
# Hyderabad region so the bot sits close to the exchange.
#
#   docker compose --env-file .env up -d --build
#   docker compose logs -f orb
#   open http://<vm-public-ip>:8080        the scoreboard
#   docker compose down
#
# The orb bot reads live NSE prices from Angel One and books SIMULATED fills.
# Angel One has no paper-trading sandbox, so real orders are deliberately not
# reachable from this file: going live means adding --real-money to the orb
# command below AND ANGEL_REAL_MONEY=I_ACCEPT_REAL_LOSSES to its environment,
# and registering this VM's static IP on your SmartAPI app. Read run.md first.
#
# The decision model is Laya, served by the `laya` service on the internal
# network only. It has no published port: nothing outside this compose project
# can reach it, and it needs no API key while that stays true.

x-bot: &bot
  build:
    context: ..
    dockerfile: deploy/Dockerfile
  restart: unless-stopped
  volumes:
    - state:/app/state
    - cache:/app/core/cache          # scrip master, bar cache, Laya decision cache
    - orb-out:/app/orb/out           # simulator state and every decision/fill log
  environment: &bot-env
    TZ: Asia/Kolkata
    BOT_STATE_DIR: /app/state
    MODEL_URL: http://laya:8000/v1/systemone
    MODEL_NAME: ${MODEL_NAME:-typed-decisions}
    LAYA_API_KEY: ${LAYA_API_KEY:-}
  logging:
    driver: json-file
    options: { max-size: "10m", max-file: "5" }

services:
  laya:                      # the decision model: Laya over /v1/systemone, CPU
    build:
      context: ..
      dockerfile: deploy/laya.Dockerfile
      args:
        LAYA_VERSION: ${LAYA_VERSION:-}
    container_name: laya
    restart: unless-stopped
    # No `ports:` on purpose. The bots reach it as http://laya:8000 inside the
    # compose network; publishing 8000 would hand the model to the internet.
    expose:
      - "8000"
    volumes:
      - models:/models      # Hugging Face cache: weights download once, not per rebuild
    environment:
      LAYA_DEVICE: cpu
      LAYA_PRELOAD: "1"
      LAYA_MODELS: ${MODEL_NAME:-typed-decisions}
      LAYA_DEFAULT_MODEL: ${MODEL_NAME:-typed-decisions}
      LAYA_MAX_LOADED: "1"
      LAYA_THREADS: "2"     # = physical cores on the A1 Always Free shape
      LAYA_API_KEY: ${LAYA_API_KEY:-}
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  orb:                       # NSE opening range breakout, filtered by Laya, simulated fills
    <<: *bot
    container_name: orb
    depends_on:
      laya:
        condition: service_healthy
    environment:
      <<: *bot-env
      BOT: orb
      ANGEL_API_KEY: ${ANGEL_API_KEY}
      ANGEL_CLIENT_CODE: ${ANGEL_CLIENT_CODE}
      ANGEL_MPIN: ${ANGEL_MPIN}
      ANGEL_TOTP_SECRET: ${ANGEL_TOTP_SECRET}
      # BROKER=indmoney switches bars and brokerage to INDmoney (see .env.example)
      BROKER: ${BROKER:-angel}
      INDSTOCKS_CLIENT_ID: ${INDSTOCKS_CLIENT_ID:-}
      INDSTOCKS_MPIN: ${INDSTOCKS_MPIN:-}
      INDSTOCKS_TOTP_SECRET: ${INDSTOCKS_TOTP_SECRET:-}
      INDSTOCKS_ACCESS_TOKEN: ${INDSTOCKS_ACCESS_TOKEN:-}
      BOT_NAME: orb
      BOT_LABEL: NSE ORB
    # Threshold and temperature come from core/calibrate.py on the in-sample
    # half of an NSE backtest. 0.30 is only a placeholder.
    command: ["--decider", "laya",
              "--model-threshold", "${ORB_MODEL_THRESHOLD:-0.30}",
              "--model-temperature", "${ORB_MODEL_TEMPERATURE:-1.0}",
              "--sim-equity", "${ORB_SIM_EQUITY:-100000}"]

  dashboard:                 # the public scoreboard: reads the state volume, trades nothing
    build:
      context: ..
      dockerfile: dashboard/Dockerfile
    container_name: dashboard
    restart: unless-stopped
    ports:
      - "8080:8080"
    volumes:
      # Read-only on purpose. The dashboard is a reader, and a bug in it must
      # not be able to corrupt the state the bots are writing.
      - state:/app/state:ro
    environment:
      TZ: Asia/Kolkata
      BOT_STATE_DIR: /app/state
      DASHBOARD_PORT: "8080"
      DASHBOARD_CURRENCY: "₹"
    logging:
      driver: json-file
      options: { max-size: "10m", max-file: "5" }

  keepalive:                 # stops Oracle reclaiming an idle Always Free VM
    <<: *bot
    container_name: keepalive
    environment:
      <<: *bot-env
      BOT: keepalive
      KEEPALIVE_TARGET_PCT: "8"

volumes:
  state:
  cache:
  orb-out:
  models:
